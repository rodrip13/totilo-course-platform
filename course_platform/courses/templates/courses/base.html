{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Course Platform{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'courses/css/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="{% url 'home' %}">Home</a> |
                <a href="{% url 'course_list' %}">Courses</a> |
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">Logout ({{ user.username }})</a>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                {% endif %}
            </nav>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer>
            <p>&copy; 2024 Course Platform</p>
        </footer>
    </div>
</body>
</html>
