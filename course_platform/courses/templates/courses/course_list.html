{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="{% static 'courses/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Available Courses</h1>
        {% if courses %}
            <ul>
                {% for course in courses %}
                    <li class="course-item"><a href="{% url 'course_detail' course.id %}">{{ course.title }}</a></li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No courses available at the moment.</p>
        {% endif %}
        <p><a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
